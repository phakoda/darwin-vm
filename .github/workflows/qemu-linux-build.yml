name: QEMU Linux build

on:
  pull_request:
    paths:
      - "patches/qemu-sptm/**"
      - "qemu-overlays/**"
      - "dt_fixup.py"
      - "scripts/apply_qemu_patches.sh"
      - "build_qemu.sh"
      - "run.sh"
      - "tests/**"
      - ".github/workflows/qemu-linux-build.yml"
  push:
    branches:
      - "display-*"
      - "aic-*"
      - "usb-*"
    paths:
      - "patches/qemu-sptm/**"
      - "qemu-overlays/**"
      - "dt_fixup.py"
      - "scripts/apply_qemu_patches.sh"
      - "build_qemu.sh"
      - "run.sh"
      - "tests/**"
      - ".github/workflows/qemu-linux-build.yml"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Validate host scripts and firmware fixups
        run: |
          bash -n run.sh build_qemu.sh scripts/apply_qemu_patches.sh
          bash tests/test_run_args.sh
          python3 tests/test_aic_fixup.py
          python3 tests/test_dt_fixup.py

      - name: Apply darwin-vm QEMU patches
        run: |
          ./scripts/apply_qemu_patches.sh
          # The helper must be safe to run again on an already-patched tree.
          ./scripts/apply_qemu_patches.sh
          git -C qemu-sptm diff --check

      - name: Install QEMU build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ninja-build \
            pkg-config \
            python3-venv \
            libglib2.0-dev \
            libpixman-1-dev \
            zlib1g-dev

      - name: Configure QEMU
        run: |
          mkdir -p qemu-sptm/build
          cd qemu-sptm/build
          ../configure \
            --target-list=aarch64-softmmu \
            --disable-docs \
            --disable-werror

      - name: Build Darwin QEMU
        run: ninja -C qemu-sptm/build qemu-system-aarch64

      - name: Verify Darwin framebuffer machine property
        run: |
          qemu-sptm/build/qemu-system-aarch64 -M darwin,help 2>&1 \
            | grep -F "boot-fb"

      - name: Verify Apple AIC and DART QOM registration
        run: |
          python3 - <<'PY'
          import json
          import subprocess

          qemu = "qemu-sptm/build/qemu-system-aarch64"
          proc = subprocess.Popen(
              [qemu, "-machine", "none", "-nodefaults", "-display", "none", "-qmp", "stdio"],
              stdin=subprocess.PIPE,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              text=True,
          )

          assert proc.stdin is not None
          assert proc.stdout is not None

          greeting = json.loads(proc.stdout.readline())
          if "QMP" not in greeting:
              raise RuntimeError(f"unexpected QMP greeting: {greeting!r}")

          def command(payload):
              proc.stdin.write(json.dumps(payload) + "\n")
              proc.stdin.flush()
              while True:
                  line = proc.stdout.readline()
                  if not line:
                      stderr = proc.stderr.read() if proc.stderr is not None else ""
                      raise RuntimeError(f"QEMU exited during QMP command; stderr={stderr}")
                  message = json.loads(line)
                  if "return" in message:
                      return message["return"]
                  if "error" in message:
                      raise RuntimeError(f"QMP command failed: {message['error']}")

          command({"execute": "qmp_capabilities"})
          types = command({
              "execute": "qom-list-types",
              "arguments": {"implements": "device", "abstract": False},
          })
          names = {entry["name"] for entry in types}
          missing = {"apple-aic", "apple-dart"} - names
          if missing:
              raise RuntimeError(f"missing QOM device types: {sorted(missing)}")

          command({"execute": "quit"})
          proc.wait(timeout=5)
          PY
